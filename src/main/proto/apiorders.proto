syntax = "proto3";

option java_package = "tgb.cryptoexchange.grpc.generated";
option java_multiple_files = true;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service OrdersService {

  rpc CreateOrder (CreateOrderGrpc) returns (CreateOrderResponseGrpc);

}

message CreateOrderGrpc {
  string id = 1;
  int64 client_id = 2;
  string internal_id = 3;
  string merchant = 4;
  string merchant_order_id = 5;
  string merchant_order_status = 6;
  int32 amount = 7;
  bool enable_unique_amount = 8;
  optional string callback_url = 9;
}

message CreateOrderResponseGrpc {
  string id = 1;
  int64 client_id = 2;
  string internal_id = 3;
  string status = 4;
  int32 amount = 5;
  bool enable_unique_amount = 6;
  optional string callback_url = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}

